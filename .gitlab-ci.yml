# Same pipeline for GitLab CI/CD: test -> security -> build -> deploy by GitOps (Argo CD watches the repo).
stages: [test, security, build]

default:
  image: node:22-alpine

.service-test:
  stage: test
  script:
    - cd services/$SERVICE
    - npm ci
    - npm run typecheck
    - npm test
    - npm audit --omit=dev --audit-level=high
  cache:
    key: $SERVICE-$CI_COMMIT_REF_SLUG
    paths: [services/$SERVICE/node_modules]

test:hub:
  extends: .service-test
  variables: { SERVICE: hub }

test:adapter:
  extends: .service-test
  variables: { SERVICE: entity-adapter }

secrets:
  stage: security
  image: { name: zricethezav/gitleaks:latest, entrypoint: [""] }
  script: gitleaks detect --source . --verbose --redact

trivy:
  stage: security
  image: { name: aquasec/trivy:latest, entrypoint: [""] }
  script: trivy fs --scanners vuln,misconfig,secret --severity HIGH,CRITICAL --exit-code 1 --ignorefile .trivyignore --skip-dirs deploy/k8s-dev .

sonarqube:
  stage: security
  image: { name: sonarsource/sonar-scanner-cli:latest, entrypoint: [""] }
  rules:
    - if: $SONAR_HOST_URL
  script: sonar-scanner -Dsonar.projectKey=mini-intercom -Dsonar.sources=services -Dsonar.exclusions=**/test/**

helm:
  stage: test
  image: { name: alpine/helm:3.19.0, entrypoint: [""] }
  script:
    - helm lint deploy/helm/mini-intercom -f deploy/helm/mini-intercom/values-production.yaml

.build:
  stage: build
  image: docker:28
  services: [docker:28-dind]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE/$NAME:$CI_COMMIT_SHORT_SHA" -f "$DOCKERFILE" "$CONTEXT"
    - docker push "$CI_REGISTRY_IMAGE/$NAME:$CI_COMMIT_SHORT_SHA"

build:hub:
  extends: .build
  variables: { NAME: hub, DOCKERFILE: services/hub/Dockerfile, CONTEXT: . }

build:adapter:
  extends: .build
  variables: { NAME: entity-adapter, DOCKERFILE: services/entity-adapter/Dockerfile, CONTEXT: services/entity-adapter }
