# Standalone (declarative) mode: routes come from apisix.yaml, no etcd and no admin API.
deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml
apisix:
  node_listen: 9080
  enable_admin: false
  enable_ipv6: false
plugin_attr:
  prometheus:
    export_addr:
      ip: 0.0.0.0
      port: 9091
