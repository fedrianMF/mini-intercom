apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mi.name" . }}-hub
  labels: {{- include "mi.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub
spec:
  {{- if not .Values.hub.autoscaling.enabled }}
  replicas: {{ .Values.hub.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: {{ include "mi.name" . }}-hub }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "mi.name" . }}-hub
        app.kubernetes.io/component: hub
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
    spec:
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: {{ include "mi.name" . }}-hub }
      containers:
        - name: hub
          image: {{ include "mi.image" (dict "root" . "image" .Values.hub.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 3000 }]
          env:
            {{- include "mi.hubEnv" . | nindent 12 }}
            - { name: OIDC_ISSUER, value: {{ .Values.hub.oidc.issuer | quote }} }
            - { name: OIDC_JWKS_URL, value: {{ .Values.hub.oidc.jwksUrl | quote }} }
            - { name: OIDC_AUDIENCE, value: {{ .Values.hub.oidc.audience | quote }} }
            - { name: LOG_LEVEL, value: {{ .Values.hub.logLevel | quote }} }
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
          resources: {{- toYaml .Values.hub.resources | nindent 12 }}
          {{- include "mi.securityContext" . | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mi.name" . }}-hub
  labels: {{- include "mi.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: {{ include "mi.name" . }}-hub }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "mi.name" . }}-hub
  labels: {{- include "mi.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: {{ include "mi.name" . }}-hub }
{{- if .Values.hub.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "mi.name" . }}-hub
  labels: {{- include "mi.labels" . | nindent 4 }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ include "mi.name" . }}-hub }
  minReplicas: {{ .Values.hub.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.hub.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.hub.autoscaling.targetCPUUtilizationPercentage }} }
{{- end }}
