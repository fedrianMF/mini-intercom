{{- if .Values.externalSecrets.enabled }}
# Credentials live in the institutional vault; External Secrets keeps the Kubernetes Secrets in sync and picks up rotations.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.hub.existingSecret }}
  labels: {{- include "mi.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef: { name: {{ .Values.externalSecrets.secretStore }}, kind: ClusterSecretStore }
  target: { name: {{ .Values.hub.existingSecret }} }
  dataFrom:
    - extract: { key: {{ .Values.externalSecrets.hubPath }} }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.adapters.existingSecret }}
  labels: {{- include "mi.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef: { name: {{ .Values.externalSecrets.secretStore }}, kind: ClusterSecretStore }
  target: { name: {{ .Values.adapters.existingSecret }} }
  dataFrom:
    - extract: { key: {{ .Values.externalSecrets.adaptersPath }} }
{{- end }}
